[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-text"
version = "1.0.0"
description = "A Windows app that reads the text out of images, screenshots and scans."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow>=9.0"]

[project.optional-dependencies]
# The built-in Windows recognizer; installed by default on Windows.
windows = ["winsdk>=1.0.0b10; sys_platform == 'win32'"]
# Optional second engine, for languages Windows has no pack for.
tesseract = ["pytesseract>=0.3.10"]
# Optional: drag and drop of files onto the window.
dnd = ["tkinterdnd2>=0.3.0"]
dev = ["pytest>=7.0", "ruff>=0.1.0", "pyinstaller>=6.0"]

[project.scripts]
image-to-text = "image_to_text.cli:main"

[project.gui-scripts]
image-to-text-gui = "image_to_text.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_to_text = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # Tk callbacks are bound at widget-creation time, which ruff reads as a
    # loop-variable binding problem.
    "B023",
]
